services:
  - type: web
    name: taasheera-api
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    dockerCommand: python render_start.py
    healthCheckPath: /health/ready
    autoDeployTrigger: commit
    envVars:
      - key: APP_ENV
        value: production
      - key: SCHEMA_AUTO_CREATE
        value: "false"
      - key: REQUIRE_TESSERACT
        value: "true"
      - key: AUTH_COOKIE_SECURE
        value: "true"
      - key: PASSPORT_UPLOADS_ENABLED
        value: "false"
      - key: AUTH_ALLOWED_ORIGINS
        value: https://shiny-tartufo-cebfc7.netlify.app
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: taasheera-db
          property: connectionString

databases:
  - name: taasheera-db
    plan: free
    region: frankfurt
    ipAllowList: []
