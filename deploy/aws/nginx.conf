server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    # CloudFront supplies this header; clients cannot bypass the distribution.
    if ($http_x_taasheera_origin != "${ORIGIN_TOKEN}") { return 403; }
    # Do not record request URLs: reset links and uploaded data are sensitive.
    access_log off;
    client_max_body_size 11m;

    location ~ ^/(auth|passports|profile|sessions|activity|assistant|applications|health)(/|$) {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        # Overwrite client input with CloudFront's generated viewer address.
        proxy_set_header X-Taasheera-Client-IP $http_cloudfront_viewer_address;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
        proxy_request_buffering on;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
