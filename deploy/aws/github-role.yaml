AWSTemplateFormatVersion: '2010-09-09'
Description: GitHub OIDC role for redeploying an existing Taasheera host (manual dev, automatic main).
Parameters:
  AppStackName:
    Type: String
    Default: taasheera
  CreateOidcProvider:
    Type: String
    Default: 'true'
    AllowedValues: ['true', 'false']
    Description: Set false if token.actions.githubusercontent.com already exists in IAM.
  TrustedSubject:
    Type: String
    Default: repo:mhs86/Taasheera:ref:refs/heads/dev
    AllowedValues:
      - repo:mhs86/Taasheera:ref:refs/heads/dev
      - repo:mhs86/Taasheera:environment:production
    Description: >-
      Who may assume the role. Deploy this template once per value: the dev role for the manual
      dev workflow, the production-environment role for deploy-main-aws.yml.
Conditions:
  NewProvider: !Equals [!Ref CreateOidcProvider, 'true']
Resources:
  Provider:
    Type: AWS::IAM::OIDCProvider
    Condition: NewProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList: [sts.amazonaws.com]
  DeployRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !If [NewProvider, !Ref Provider, !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com']
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub: !Ref TrustedSubject
      Policies:
        - PolicyName: RedeployExistingHost
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: cloudformation:DescribeStacks
                Resource: !Sub 'arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${AppStackName}/*'
              - Effect: Allow
                Action: [ssm:ListCommandInvocations, ssm:GetCommandInvocation]
                Resource: '*'
              - Effect: Allow
                Action: ssm:SendCommand
                Resource: !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}::document/AWS-RunShellScript'
              - Effect: Allow
                Action: ssm:SendCommand
                Resource: !Sub 'arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:instance/*'
                Condition:
                  StringEquals:
                    ssm:resourceTag/aws:cloudformation:stack-name: !Ref AppStackName
      Tags:
        - {Key: OwnerEmail, Value: mhs86@mail.aub.edu}
Outputs:
  DeployRoleArn:
    Value: !GetAtt DeployRole.Arn
