name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: taasheera_ci
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: taasheera_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U taasheera_ci -d taasheera_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_POSTGRES_URL: postgresql+psycopg://taasheera_ci:ci-only-password@127.0.0.1:5432/taasheera_ci
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements.lock
            backend/requirements-dev.txt
            backend/requirements-dev.lock
      - name: Install OCR and test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y tesseract-ocr fonts-dejavu-core
          python -m pip install -r backend/requirements-dev.lock
      - name: Test API, OCR, and migrations
        working-directory: backend
        run: python -m pytest -q
      - name: Check migrated PostgreSQL schema for drift
        working-directory: backend
        run: DATABASE_URL="$TEST_POSTGRES_URL" python -m alembic check

  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run build

  container:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Build backend image
        run: docker build -t taasheera-backend-ci backend
      # Public ECR rate-limits shared GitHub runners (429 "Data limit exceeded"), so the adapter
      # image is pulled once, kept in the Actions cache, and loaded from there on later runs.
      - name: Restore Lambda adapter image
        id: adapter-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/lambda-adapter.tar
          key: lambda-adapter-1.1.0-amd64
      - name: Load Lambda adapter image
        env:
          ADAPTER: public.ecr.aws/awsguru/aws-lambda-adapter:1.1.0
          CACHED: ${{ steps.adapter-cache.outputs.cache-hit }}
          ARCHIVE: ${{ runner.temp }}/lambda-adapter.tar
        run: |
          if [ "$CACHED" = "true" ]; then
            docker load --input "$ARCHIVE"
            exit 0
          fi
          for attempt in 1 2 3 4 5; do
            if docker pull --platform linux/amd64 "$ADAPTER"; then
              docker save --output "$ARCHIVE" "$ADAPTER"
              exit 0
            fi
            echo "Public ECR refused the pull (attempt $attempt/5); waiting before retrying"
            sleep $((attempt * 20))
          done
          exit 1
      - name: Build Lambda image
        run: docker build --platform linux/amd64 -f backend/Dockerfile.lambda -t taasheera-lambda-ci backend
      - name: Migrate and smoke-test backend image
        run: |
          docker volume create taasheera-ci-data
          printf 'JWT_SECRET=%s\n' "$(openssl rand -hex 32)" > "$RUNNER_TEMP/taasheera-ci.env"
          printf 'AUTH_ALLOWED_ORIGINS=https://ci.invalid\n' >> "$RUNNER_TEMP/taasheera-ci.env"
          docker run --rm --env-file "$RUNNER_TEMP/taasheera-ci.env" \
            -e DATABASE_URL=sqlite:////app/storage/ci.db \
            -v taasheera-ci-data:/app/storage \
            --entrypoint python taasheera-backend-ci migrate.py upgrade
          # The image ships the operator command; an unknown account is refused without changes.
          if docker run --rm --env-file "$RUNNER_TEMP/taasheera-ci.env" \
            -e DATABASE_URL=sqlite:////app/storage/ci.db \
            -v taasheera-ci-data:/app/storage \
            --entrypoint python taasheera-backend-ci manage.py set-role --email nobody@example.com --role admin \
            2> "$RUNNER_TEMP/set-role.err"; then
            echo "manage.py set-role accepted an unknown account"
            exit 1
          fi
          grep -q "No account uses that email" "$RUNNER_TEMP/set-role.err"
          docker run -d --name taasheera-ci --env-file "$RUNNER_TEMP/taasheera-ci.env" \
            -e DATABASE_URL=sqlite:////app/storage/ci.db \
            -v taasheera-ci-data:/app/storage \
            -p 127.0.0.1:18000:8000 taasheera-backend-ci
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:18000/health/ready; then exit 0; fi
            echo "Waiting for API readiness ($attempt/30)"
            sleep 1
          done
          docker logs taasheera-ci
          exit 1
      - name: Stop smoke-test container
        if: always()
        run: |
          docker rm -f taasheera-ci 2>/dev/null || true
          docker volume rm taasheera-ci-data 2>/dev/null || true
