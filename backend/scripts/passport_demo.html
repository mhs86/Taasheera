<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Passport Pipeline Test</title>
<style>
  :root {
    --bg: #f6f4ef; --panel: #ffffff; --ink: #1d1f24; --muted: #6b6f78; --line: #e2dfd7;
    --accent: #1f5f5b; --accent-ink: #ffffff;
    --ok: #1d7a46; --ok-bg: #e7f4ec; --warn: #9a6100; --warn-bg: #fdf3df; --bad: #b3261e; --bad-bg: #fbe9e7;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #15171b; --panel: #1e2126; --ink: #eceae4; --muted: #9a9ea8; --line: #30343b;
      --accent: #5cb3ab; --accent-ink: #0f1a19;
      --ok: #6fcf97; --ok-bg: #1b2e23; --warn: #f2c36b; --warn-bg: #2f2615; --bad: #f28b82; --bad-bg: #331c1a;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 1080px; margin: 0 auto; padding: 24px 16px 64px; }
  header { display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: end; justify-content: space-between;
           border-bottom: 1px solid var(--line); padding-bottom: 16px; margin-bottom: 24px; }
  h1 { font-size: 22px; margin: 0; letter-spacing: -0.01em; }
  header p { margin: 2px 0 0; color: var(--muted); }
  .traveler { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 14px; }
  .traveler select { font: inherit; padding: 4px 8px; border: 1px solid var(--line); border-radius: 6px;
                     background: var(--panel); color: var(--ink); }

  .grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 24px; }
  @media (max-width: 820px) { .grid { grid-template-columns: 1fr; } }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 20px; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); margin: 0 0 12px; }

  .drop { border: 2px dashed var(--line); border-radius: 8px; padding: 28px 16px; text-align: center;
          cursor: pointer; transition: border-color .15s, background .15s; }
  .drop:hover, .drop.over { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 6%, transparent); }
  .drop strong { display: block; font-size: 16px; }
  .drop span { color: var(--muted); font-size: 13px; }
  .buttons { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
  button { font: inherit; font-size: 14px; padding: 7px 14px; border-radius: 6px; cursor: pointer;
           border: 1px solid var(--line); background: var(--panel); color: var(--ink); }
  button:hover { border-color: var(--accent); }
  button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  button:disabled { opacity: .5; cursor: default; }
  input[type=file] { display: none; }

  .preview { margin-top: 16px; }
  .preview img { width: 100%; border-radius: 6px; border: 1px solid var(--line); display: block; }
  .meta { font-family: var(--mono); font-size: 12px; color: var(--muted); margin-top: 8px; word-break: break-all; }

  .banner { border-radius: 8px; padding: 10px 14px; margin-bottom: 16px; font-weight: 600; }
  .banner small { display: block; font-weight: 400; }
  .banner.verified { background: var(--ok-bg); color: var(--ok); }
  .banner.needs_review { background: var(--warn-bg); color: var(--warn); }
  .banner.unreadable, .banner.error { background: var(--bad-bg); color: var(--bad); }
  .empty { color: var(--muted); padding: 32px 0; text-align: center; }

  form { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 14px; }
  .field { display: flex; flex-direction: column; gap: 4px; }
  .field.wide { grid-column: 1 / -1; }
  label { font-size: 13px; font-weight: 600; }
  .field input, .field select { font: inherit; padding: 7px 9px; border-radius: 6px; width: 100%;
         border: 1px solid var(--line); background: var(--bg); color: var(--ink); }
  .field .mono { font-family: var(--mono); }
  .hint { font-size: 12px; }
  .field.ok input, .field.ok select { border-color: var(--ok); }
  .field.ok .hint { color: var(--ok); }
  .field.confirm input, .field.confirm select { border-color: var(--warn); }
  .field.confirm .hint { color: var(--warn); }
  .field.suspect input, .field.suspect select { border-color: var(--bad); background: var(--bad-bg); }
  .field.suspect .hint { color: var(--bad); }
  .actions { grid-column: 1 / -1; display: flex; justify-content: flex-end; margin-top: 4px; }

  .checks { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 16px; padding: 0; list-style: none; }
  .checks li { font-size: 12px; font-family: var(--mono); padding: 2px 8px; border-radius: 999px; }
  .checks .pass { background: var(--ok-bg); color: var(--ok); }
  .checks .fail { background: var(--bad-bg); color: var(--bad); }
  pre { background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 12px;
        font-size: 12px; overflow-x: auto; margin: 16px 0 0; }
  details { margin-top: 16px; }
  summary { cursor: pointer; color: var(--muted); font-size: 13px; }
  @media (max-width: 520px) { form { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<main>
  <header>
    <div>
      <h1>Passport pipeline test</h1>
      <p>Upload (US 6) → extraction (US 7) → review (US 8 prototype). Local demo, no real login.</p>
    </div>
    <label class="traveler">Acting as
      <select id="traveler">
        <option value="1">Traveler 1</option>
        <option value="2">Traveler 2</option>
      </select>
    </label>
  </header>

  <div class="grid">
    <section class="panel">
      <h2>1 · Passport photo</h2>
      <div class="drop" id="drop" tabindex="0" role="button" aria-label="Choose a passport image">
        <strong>Drop a passport photo here</strong>
        <span>or click to choose · JPEG, PNG or WebP · up to 10 MB</span>
      </div>
      <input type="file" id="file" accept="image/jpeg,image/png,image/webp">
      <input type="file" id="camera" accept="image/*" capture="environment">
      <div class="buttons">
        <button type="button" id="camera-btn">Use camera</button>
        <button type="button" data-blur="0">Try specimen</button>
        <button type="button" data-blur="6">Try blurry specimen</button>
      </div>
      <div class="preview" id="preview" hidden>
        <img id="stored" alt="Stored passport image">
        <div class="meta" id="meta"></div>
        <div class="buttons">
          <button type="button" id="reextract">Extract again</button>
        </div>
      </div>
    </section>

    <section class="panel">
      <h2>2 · Review details</h2>
      <div id="result"><p class="empty">Upload a photo to see the extracted fields.</p></div>
    </section>
  </div>
</main>

<script>
const FIELDS = [
  ["surname", "Surname", "text"],
  ["given_names", "Given names", "text"],
  ["document_number", "Passport number", "mono"],
  ["personal_number", "Personal number", "mono"],
  ["nationality", "Nationality", "mono"],
  ["issuing_country", "Issuing country", "mono"],
  ["birth_date", "Date of birth", "date"],
  ["expiry_date", "Expiry date", "date"],
  ["sex", "Sex", "sex"],
];
const STATUS = {
  verified: ["All check digits passed", "Check digits catch most misreads, not all. Confirm every field, especially the amber ones."],
  needs_review: ["Some fields need your attention", "A check digit failed. Fix the fields marked red."],
  unreadable: ["Couldn't read the passport", "Enter the details by hand, or try a sharper, flatter photo."],
};

const $ = (id) => document.getElementById(id);
let currentId = null;

function headers() { return { "X-Demo-Traveler": $("traveler").value }; }

async function errorText(response) {
  try { const body = await response.json(); return typeof body.detail === "string" ? body.detail : JSON.stringify(body.detail); }
  catch { return response.statusText; }
}

function showError(title, detail) {
  const box = $("result");
  box.replaceChildren();
  const banner = document.createElement("div");
  banner.className = "banner error";
  banner.textContent = title;
  const small = document.createElement("small");
  small.textContent = detail;
  banner.append(small);
  box.append(banner);
}

async function upload(file) {
  const body = new FormData();
  body.append("file", file, file.name || "passport.jpg");
  $("result").innerHTML = '<p class="empty">Uploading…</p>';
  const response = await fetch("/passports", { method: "POST", body, headers: headers() });
  if (!response.ok) {
    $("preview").hidden = true;
    return showError(`Upload rejected (${response.status})`, await errorText(response));
  }
  currentId = (await response.json()).id;
  await showStoredImage();
  await extract();
}

async function showStoredImage() {
  const response = await fetch(`/passports/${currentId}/image`, { headers: headers() });
  if (!response.ok) return;
  const blob = await response.blob();
  $("stored").src = URL.createObjectURL(blob);
  $("meta").textContent = `id ${currentId} · stored as ${(blob.size / 1024).toFixed(0)} KB JPEG (rotation fixed, metadata stripped)`;
  $("preview").hidden = false;
}

async function extract() {
  $("result").innerHTML = '<p class="empty">Reading the MRZ…</p>';
  const started = performance.now();
  const response = await fetch(`/passports/${currentId}/extract`, { method: "POST", headers: headers() });
  const seconds = ((performance.now() - started) / 1000).toFixed(2);
  if (!response.ok) {
    return showError(`Extraction refused (${response.status})`,
      response.status === 404
        ? `Traveler ${$("traveler").value} doesn't own this upload, so it looks like it doesn't exist.`
        : await errorText(response));
  }
  renderResult(await response.json(), seconds);
}

function renderResult(data, seconds) {
  const box = $("result");
  box.replaceChildren();

  const [title, detail] = STATUS[data.status];
  const banner = document.createElement("div");
  banner.className = `banner ${data.status}`;
  banner.textContent = `${title} · ${seconds} s`;
  const small = document.createElement("small");
  small.textContent = detail;
  banner.append(small);
  box.append(banner);

  if (Object.keys(data.checks).length) {
    const list = document.createElement("ul");
    list.className = "checks";
    for (const [name, ok] of Object.entries(data.checks)) {
      const item = document.createElement("li");
      item.className = ok ? "pass" : "fail";
      item.textContent = `${ok ? "✓" : "✗"} ${name.replaceAll("_", " ")}`;
      list.append(item);
    }
    box.append(list);
  }

  const form = document.createElement("form");
  const values = data.fields || {};
  for (const [key, label, kind] of FIELDS) {
    const field = document.createElement("div");
    field.className = "field";
    if (key === "surname" || key === "given_names") field.classList.add("wide");

    let hint = "";
    if (data.fields) {
      if (data.suspect_fields.includes(key)) { field.classList.add("suspect"); hint = "Check failed. Please correct"; }
      else if (data.unverifiable_fields.includes(key)) { field.classList.add("confirm"); hint = "No check digit. Please confirm"; }
      else if (data.corrected_fields.includes(key)) { field.classList.add("ok"); hint = "✓ OCR misread fixed using the check digit"; }
      else if (data.checks[key]) { field.classList.add("ok"); hint = "✓ Passed check digit"; }
    }

    const labelEl = document.createElement("label");
    labelEl.htmlFor = `f-${key}`;
    labelEl.textContent = label;
    let input;
    if (kind === "sex") {
      input = document.createElement("select");
      for (const [value, text] of [["F", "Female"], ["M", "Male"], ["X", "Unspecified"]]) {
        input.append(new Option(text, value));
      }
      input.value = values[key] || "X";
    } else {
      input = document.createElement("input");
      input.type = kind === "date" ? "date" : "text";
      if (kind === "mono") input.className = "mono";
      input.value = values[key] ?? "";
    }
    input.id = `f-${key}`;
    input.name = key;
    field.append(labelEl, input);
    if (hint) {
      const hintEl = document.createElement("span");
      hintEl.className = "hint";
      hintEl.textContent = hint;
      field.append(hintEl);
    }
    form.append(field);
  }

  const actions = document.createElement("div");
  actions.className = "actions";
  const confirmBtn = document.createElement("button");
  confirmBtn.type = "submit";
  confirmBtn.className = "primary";
  confirmBtn.textContent = "Confirm details";
  actions.append(confirmBtn);
  form.append(actions);

  const confirmed = document.createElement("pre");
  confirmed.hidden = true;
  form.addEventListener("submit", (event) => {
    event.preventDefault();
    const payload = Object.fromEntries(new FormData(form));
    confirmed.textContent = "Would be saved as confirmed (saving arrives with US 8):\n" + JSON.stringify(payload, null, 2);
    confirmed.hidden = false;
  });
  box.append(form, confirmed);

  const raw = document.createElement("details");
  const summary = document.createElement("summary");
  summary.textContent = "Raw API response";
  const pre = document.createElement("pre");
  pre.textContent = JSON.stringify(data, null, 2);
  raw.append(summary, pre);
  box.append(raw);
}

// Wiring
const drop = $("drop");
drop.addEventListener("click", () => $("file").click());
drop.addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); $("file").click(); } });
drop.addEventListener("dragover", (e) => { e.preventDefault(); drop.classList.add("over"); });
drop.addEventListener("dragleave", () => drop.classList.remove("over"));
drop.addEventListener("drop", (e) => {
  e.preventDefault();
  drop.classList.remove("over");
  if (e.dataTransfer.files[0]) upload(e.dataTransfer.files[0]);
});
for (const id of ["file", "camera"]) {
  $(id).addEventListener("change", (e) => { if (e.target.files[0]) upload(e.target.files[0]); e.target.value = ""; });
}
$("camera-btn").addEventListener("click", () => $("camera").click());
$("reextract").addEventListener("click", () => currentId && extract());
for (const button of document.querySelectorAll("[data-blur]")) {
  button.addEventListener("click", async () => {
    const response = await fetch(`/demo/specimen.jpg?blur=${button.dataset.blur}`);
    if (!response.ok) return showError("Couldn't generate the specimen", await errorText(response));
    upload(new File([await response.blob()], "specimen.jpg", { type: "image/jpeg" }));
  });
}
</script>
</body>
</html>
